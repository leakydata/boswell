<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1215">
<title>Boswell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F1F4F5; --surface:#FFF; --sunk:#E7ECEE;
  --ink:#101619; --muted:#5C6B71; --faint:#93A4AA; --rule:#D2DBDE;
  --accent:#12697A; --ok:#2C7A55; --warn:#A8761B; --bad:#A83C2C;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#0C1215; --surface:#141C20; --sunk:#0F171A;
  --ink:#E8EFF1; --muted:#8DA0A7; --faint:#67787F; --rule:#263338;
  --accent:#46AEC2; --ok:#4FB37F; --warn:#D3A03F; --bad:#DB6B57;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:20px}
h1{font-size:26px;font-weight:600;letter-spacing:-.03em;margin:0}
h1 span{color:var(--accent)}
.ver{font-family:var(--mono);font-size:11px;color:var(--faint)}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px}
.card h2{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin:0 0 12px}

/* status */
.status{display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--faint);flex:none;
  box-shadow:0 0 0 4px transparent;transition:background .2s,box-shadow .2s}
.dot.live{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.buf{background:#9B59B6;box-shadow:0 0 0 4px #9B59B633}
.dot.drain{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.dot.idle{background:var(--bad)}
.dot.off{background:var(--faint)}
.stxt{font-weight:600;font-size:17px}
.ssub{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* meter */
.meter{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;width:0;background:var(--accent);
  transition:width .12s linear}
.meter i.hot{background:var(--bad)}

/* stats */
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:7px 12px}
dt{font-size:13.5px;color:var(--muted)}
dd{margin:0;font-family:var(--mono);font-size:13.5px;text-align:right;
  font-variant-numeric:tabular-nums}

/* controls */
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:var(--sans);font-size:15px;font-weight:500;padding:12px 16px;
  min-height:46px;border-radius:6px;border:1px solid var(--rule);
  background:var(--sunk);color:var(--ink);cursor:pointer;flex:1 1 auto}
button:hover{border-color:var(--accent)}
button:active{transform:translateY(1px)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.dang{background:transparent;border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:14px;font-size:14px}
input[type=range]{flex:1;accent-color:var(--accent);height:34px}
.val{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:58px;text-align:right}
.switch{width:50px;height:29px;border-radius:15px;background:var(--sunk);
  border:1px solid var(--rule);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;
  border-radius:50%;background:var(--faint);transition:transform .16s,background .16s}
.switch[aria-checked=true]{background:color-mix(in srgb,var(--accent) 25%,transparent);
  border-color:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(21px);background:var(--accent)}

/* log */
#log{font-family:var(--mono);font-size:12px;color:var(--muted);max-height:180px;
  overflow-y:auto;margin:0;padding:0;list-style:none}
#log li{padding:4px 0;border-bottom:1px solid var(--rule)}
#log li:last-child{border:none}
.err{color:var(--bad);font-family:var(--mono);font-size:12.5px;margin-top:10px}

/* tabs */
nav.tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--sunk);
  padding:4px;border-radius:8px}
nav.tabs button{flex:1;min-height:42px;padding:9px;border:none;background:transparent;
  border-radius:6px;font-weight:600;font-size:14.5px;color:var(--muted)}
nav.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 3px #0002}
.view[hidden]{display:none}

/* clip list */
.clip{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  padding:13px 12px;background:var(--surface);border:1px solid var(--rule);
  border-radius:8px;margin-bottom:8px;min-height:auto}
.clip:hover{border-color:var(--accent)}
.clip .ci{flex:1;min-width:0}
.clip .cn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.clip .cp{font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.clip .cd{font-family:var(--mono);font-size:12px;color:var(--faint);flex:none}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:3px;font-weight:600;flex:none}
.tag.none{background:var(--sunk);color:var(--faint)}
.tag.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.running{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.error{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

/* transcript */
audio{width:100%;margin:6px 0 14px}
.seg{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px}
.seg:last-child{border:none}
.seg .t{font-family:var(--mono);font-size:11.5px;color:var(--faint);flex:none;
  width:44px;padding-top:3px;font-variant-numeric:tabular-nums;cursor:pointer}
.seg .t:hover{color:var(--accent)}
.who{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;
  border-radius:3px;background:var(--sunk);color:var(--muted);cursor:pointer;
  white-space:nowrap;border:1px solid transparent}
.who.named{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);
  border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.who:hover{border-color:var(--accent)}
.spk{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.empty{color:var(--muted);font-size:14.5px;padding:22px 0;text-align:center}

/* naming sheet -- replaces prompt(), which mobile browsers block */
#namer{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--rule);border-radius:14px 14px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 32px #0003;transform:translateY(110%);transition:transform .2s ease}
#namer.open{transform:none}
#namer h3{margin:0 0 4px;font-size:17px;font-weight:600}
#namer .hint{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:14px}
#namer input[type=text]{width:100%;font-family:var(--sans);font-size:17px;padding:13px;
  border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);
  margin-bottom:10px}
#namer input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.quick button{flex:0 0 auto;min-height:38px;padding:7px 14px;font-size:14px;border-radius:18px}
#scrim{position:fixed;inset:0;background:#0006;z-index:49;opacity:0;pointer-events:none;
  transition:opacity .2s}
#scrim.open{opacity:1;pointer-events:auto}
#namerErr{color:var(--bad);font-family:var(--mono);font-size:12px;min-height:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bos<span>well</span></h1>
    <span class="ver" id="ver">disconnected</span>
  </header>

  <nav class="tabs" role="tablist">
    <button id="tabDev" role="tab" aria-selected="true">Device</button>
    <button id="tabRec" role="tab" aria-selected="false">Recordings</button>
  </nav>

  <div class="view" id="viewDev">
  <div class="grid">
    <div class="card">
      <h2>Device</h2>
      <div class="status">
        <span class="dot off" id="dot"></span>
        <div>
          <div class="stxt" id="stxt">Not connected</div>
          <div class="ssub" id="ssub">press Connect to begin</div>
        </div>
      </div>
      <div class="meter"><i id="meter"></i></div>
    </div>

    <div class="card">
      <h2>Signal</h2>
      <dl>
        <dt>Frames received</dt><dd id="frames">0</dd>
        <dt>Frames lost</dt><dd id="lost">0</dd>
        <dt>Sample rate</dt><dd id="rate">—</dd>
        <dt>Buffered on device</dt><dd id="backlog">0.0 s</dd>
        <dt>Unsaved clip</dt><dd id="clip">0.0 s</dd>
        <dt>Flash · IMU</dt><dd id="hw">—</dd>
      </dl>
    </div>

    <div class="card span2">
      <h2>Controls</h2>
      <div class="btns">
        <button class="pri" id="bConn">Connect</button>
        <button id="bArm" disabled>Stop capture</button>
        <button id="bSave" disabled>Save clip</button>
        <button class="dang" id="bDis" disabled>Disconnect</button>
      </div>
      <label class="row">Microphone gain
        <input type="range" id="gain" min="20" max="70" value="50" step="1" disabled>
        <span class="val" id="gainv">50 · +5 dB</span>
      </label>
      <label class="row">Voice activity gating
        <span class="switch" id="vad" role="switch" aria-checked="false" tabindex="0"></span>
      </label>
      <div class="err" id="err"></div>
    </div>

    <div class="card span2">
      <h2>Activity</h2>
      <ul id="log"><li>waiting for connection…</li></ul>
    </div>
  </div>
  </div>

  <div class="view" id="viewRec" hidden>
    <div class="btns" style="margin-bottom:14px">
      <button class="pri" id="bAll">Transcribe all</button>
      <button id="bRefresh">Refresh</button>
      <span class="val" id="qdepth" style="align-self:center"></span>
    </div>
    <div class="card" id="clipList" style="border:none;background:transparent;padding:0">
      <div class="empty">loading…</div>
    </div>

    <div class="card" id="detail" hidden>
      <h2 id="dTitle">Transcript</h2>
      <audio id="player" controls preload="none"></audio>
      <div class="spk" id="dSpeakers"></div>
      <div id="dSegs"></div>
      <div class="btns" style="margin-top:16px">
        <button id="bBack">Back to list</button>
        <button class="pri" id="bTranscribe">Transcribe</button>
      </div>
    </div>
  </div>
</div>

<div id="scrim"></div>
<div id="namer" role="dialog" aria-modal="true" aria-labelledby="namerT">
  <h3 id="namerT">Who is this?</h3>
  <div class="hint" id="namerSub"></div>
  <div class="quick" id="namerQuick"></div>
  <input type="text" id="namerInput" placeholder="Type a name" autocomplete="off"
         autocapitalize="words" enterkeyhint="done">
  <div id="namerErr"></div>
  <div class="btns" style="margin-top:10px">
    <button id="namerCancel">Cancel</button>
    <button class="pri" id="namerSave">Save name</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let ws, armed = false, connected = false;

function log(t){
  const ul = $("log");
  if (ul.children.length === 1 && ul.children[0].textContent.startsWith("waiting")) ul.innerHTML = "";
  const li = document.createElement("li");
  li.textContent = new Date().toLocaleTimeString() + "  " + t;
  ul.prepend(li);
  while (ul.children.length > 60) ul.lastChild.remove();
}

function send(o){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function paint(s){
  connected = s.connected; armed = s.armed;
  const dot = $("dot");
  dot.className = "dot " + (!s.connected ? (s.scanning ? "off" : "off")
                    : !s.armed ? "idle"
                    : s.backlog_bytes > 0 ? "drain" : "live");
  $("stxt").textContent = !s.connected ? (s.scanning ? "Searching…" : "Not connected")
                        : !s.armed ? "Connected · paused"
                        : s.backlog_bytes > 0 ? "Draining buffer" : "Recording";
  $("ssub").textContent = !s.connected ? (s.error || "press Connect to begin")
                        : `${s.rate/1000} kHz · ADPCM · ${s.frames} frames`;
  $("ver").textContent = s.connected ? "XIAO-MIC" : "disconnected";
  $("frames").textContent = s.frames;
  $("lost").textContent = s.lost;
  $("rate").textContent = s.rate ? (s.rate/1000) + " kHz" : "—";
  $("backlog").textContent = s.backlog_seconds.toFixed(1) + " s";
  $("clip").textContent = (s.clip_seconds||0).toFixed(1) + " s";
  $("hw").textContent = (s.qspi_mb ? s.qspi_mb + " MB" : "—") + " · " + (s.imu ? "ok" : "—");
  const m = $("meter");
  m.style.width = Math.round((s.level||0)*100) + "%";
  m.classList.toggle("hot", (s.peak||0) > 30000);
  $("bArm").textContent = s.armed ? "Stop capture" : "Start capture";
  $("bArm").disabled = !s.connected;
  $("bSave").disabled = !s.connected;
  $("bDis").disabled = !s.connected && !s.scanning;
  $("gain").disabled = !s.connected;
  $("bConn").disabled = s.connected || s.scanning;
  $("err").textContent = s.error || "";
}

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "state") paint(m);
    else if (m.type === "log") log(m.text);
    else if (m.type === "clip"){ log("clip written: " + m.path);
      if (!$("viewRec").hidden && $("detail").hidden) loadClips(); }
    else if (m.type === "job"){
      log(`transcription ${m.status}: ${m.clip}` + (m.error ? " — " + m.error : ""));
      if (m.status === "done"){
        if (current === m.clip) renderTranscript(m.clip);
        if (!$("viewRec").hidden && $("detail").hidden) loadClips();
      }
    }
  };
  ws.onclose = () => { log("server connection lost — retrying"); setTimeout(connect, 2000); };
}
connect();

/* ---- tabs ---- */
let current = null;
function showTab(rec){
  $("tabDev").setAttribute("aria-selected", !rec);
  $("tabRec").setAttribute("aria-selected", rec);
  $("viewDev").hidden = rec;
  $("viewRec").hidden = !rec;
  if (rec) loadClips();
}
$("tabDev").onclick = () => showTab(false);
$("tabRec").onclick = () => showTab(true);

/* ---- recordings ---- */
async function loadClips(){
  const el = $("clipList");
  try{
    const clips = await (await fetch("/api/clips")).json();
    if (!clips.length){ el.innerHTML = '<div class="empty">No recordings yet. Capture some audio on the Device tab.</div>'; return; }
    el.innerHTML = "";
    for (const c of clips){
      const b = document.createElement("button");
      b.className = "clip";
      b.innerHTML = `<div class="ci">
          <div class="cn">${new Date(c.modified*1000).toLocaleString()}</div>
          <div class="cp">${c.preview || "<i style='opacity:.6'>not transcribed</i>"}</div>
        </div>
        <span class="cd">${c.seconds.toFixed(0)}s</span>
        <span class="tag ${c.status}">${c.status === "none" ? "new" : c.status}</span>`;
      b.onclick = () => openClip(c.name);
      el.appendChild(b);
    }
  }catch(e){ el.innerHTML = '<div class="empty">could not load recordings</div>'; }
}

async function openClip(name){
  current = name;
  $("clipList").hidden = true;
  $("detail").hidden = false;
  $("dTitle").textContent = name;
  $("player").src = "/api/audio/" + encodeURIComponent(name);
  $("dSegs").innerHTML = '<div class="empty">loading…</div>';
  $("dSpeakers").innerHTML = "";
  await renderTranscript(name);
}

async function renderTranscript(name){
  const r = await fetch("/api/transcript/" + encodeURIComponent(name));
  if (!r.ok){
    $("dSegs").innerHTML = '<div class="empty">Not transcribed yet — press Transcribe.</div>';
    return;
  }
  const t = await r.json();
  const named = t.speakers || {};
  const label = s => (named[s] && named[s].name) ? named[s].name : s;

  const ids = [...new Set(t.segments.map(s => s.speaker).filter(Boolean))];
  $("dSpeakers").innerHTML = "";
  for (const id of ids){
    const chip = document.createElement("span");
    const known = named[id] && named[id].name;
    const score = named[id] ? named[id].score : 0;
    chip.className = "who" + (known ? " named" : "");
    // Showing the score makes a near-miss legible instead of mysterious.
    chip.textContent = known
      ? `${named[id].name} · ${score.toFixed(2)} · tap to rename`
      : `${id} · best ${score ? score.toFixed(2) : "—"} · tap to name`;
    chip.onclick = () => nameSpeaker(name, id, known || "");
    $("dSpeakers").appendChild(chip);
  }

  $("dSegs").innerHTML = "";
  if (!t.segments.length){ $("dSegs").innerHTML = '<div class="empty">No speech detected in this clip.</div>'; return; }
  for (const s of t.segments){
    const d = document.createElement("div");
    d.className = "seg";
    const who = s.speaker ? `<span class="who ${named[s.speaker]&&named[s.speaker].name?'named':''}">${label(s.speaker)}</span> ` : "";
    d.innerHTML = `<span class="t" data-at="${s.start}">${s.start.toFixed(0)}s</span><div>${who}${s.text}</div>`;
    d.querySelector(".t").onclick = () => { const p = $("player"); p.currentTime = s.start; p.play(); };
    $("dSegs").appendChild(d);
  }
}

/* prompt() is blocked or silently ignored by most mobile browsers, so the
   naming flow is an in-page sheet instead. */
let namerCtx = null;

async function nameSpeaker(clip, speaker, existing){
  namerCtx = {clip, speaker};
  $("namerT").textContent = existing ? `Rename ${existing}?` : "Who is speaking?";
  $("namerSub").textContent = `${speaker} · ${clip}`;
  $("namerInput").value = existing || "";
  $("namerErr").textContent = "";

  const q = $("namerQuick");
  q.innerHTML = "";
  try{
    const people = await (await fetch("/api/speakers")).json();
    for (const p of people){
      const b = document.createElement("button");
      b.textContent = `${p.name} (${p.samples})`;
      b.onclick = () => { $("namerInput").value = p.name; saveName(); };
      q.appendChild(b);
    }
  }catch(e){}

  $("scrim").classList.add("open");
  $("namer").classList.add("open");
  setTimeout(() => $("namerInput").focus(), 220);
}

function closeNamer(){
  $("scrim").classList.remove("open");
  $("namer").classList.remove("open");
  namerCtx = null;
}

async function saveName(){
  if (!namerCtx) return;
  const name = $("namerInput").value.trim();
  if (!name){ $("namerErr").textContent = "Enter a name first"; return; }
  $("namerSave").disabled = true;
  try{
    const r = await fetch("/api/label", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({clip: namerCtx.clip, speaker: namerCtx.speaker, name})
    });
    const body = await r.json().catch(() => ({}));
    if (r.ok){
      log(`labelled ${namerCtx.speaker} as ${name} (${body.samples} sample(s))`);
      const clip = namerCtx.clip;
      closeNamer();
      await renderTranscript(clip);
    } else {
      $("namerErr").textContent = body.detail || "Could not save that name";
    }
  }catch(e){
    $("namerErr").textContent = "Network error — is the server still running?";
  }finally{
    $("namerSave").disabled = false;
  }
}

$("namerSave").onclick = saveName;
$("namerCancel").onclick = closeNamer;
$("scrim").onclick = closeNamer;
$("namerInput").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); saveName(); }
  if (e.key === "Escape") closeNamer();
});

$("bAll").onclick = async () => {
  const r = await (await fetch("/api/transcribe_all", {method:"POST"})).json();
  log(`queued ${r.queued} clip(s)`);
  pollQueue();
};
$("bRefresh").onclick = () => loadClips();

async function pollQueue(){
  try{
    const q = await (await fetch("/api/queue")).json();
    $("qdepth").textContent = q.busy ? `${q.pending + 1} left…` : (q.pending ? `${q.pending} left…` : "");
    if (q.busy || q.pending) setTimeout(pollQueue, 2500);
    else loadClips();
  }catch(e){}
}
setInterval(() => { if (!$("viewRec").hidden && $("detail").hidden) pollQueue(); }, 8000);

$("bBack").onclick = () => { $("detail").hidden = true; $("clipList").hidden = false; loadClips(); };
$("bTranscribe").onclick = async () => {
  if (!current) return;
  await fetch("/api/transcribe/" + encodeURIComponent(current), {method:"POST"});
  $("dSegs").innerHTML = '<div class="empty">transcribing… this takes a few seconds</div>';
};

$("bConn").onclick = () => { send({cmd:"connect"}); log("scanning for device…"); };
$("bDis").onclick  = () => { send({cmd:"disconnect"}); log("disconnected"); };
$("bArm").onclick  = () => send({cmd:"arm", on: !armed});
$("bSave").onclick = () => send({cmd:"save"});

const gain = $("gain");
gain.oninput = () => {
  const v = +gain.value;
  $("gainv").textContent = `${v} · ${(v-40)*0.5 >= 0 ? "+" : ""}${((v-40)*0.5).toFixed(1)} dB`;
};
gain.onchange = () => send({cmd:"gain", value:+gain.value});

const vad = $("vad");
function toggleVad(){
  const on = vad.getAttribute("aria-checked") !== "true";
  vad.setAttribute("aria-checked", on);
  send({cmd:"vad", on});
}
vad.onclick = toggleVad;
vad.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleVad(); } };
</script>
</body>
</html>
