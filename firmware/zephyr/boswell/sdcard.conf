# Card support, kept out of prj.conf so the wearable without a card builds
# exactly as before. See boards/audio_bff.overlay for the wiring.

CONFIG_SPI=y
CONFIG_SPI_NRFX=y

CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_STACK=y

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Format a blank card rather than refusing to mount one. A card that has never
# been used is the expected state for a new build, and "no filesystem" is not
# a hardware fault worth reporting as one.
CONFIG_FS_FATFS_MOUNT_MKFS=y

# 16 GB cards ship formatted FAT32, which ELM handles without this. It is here
# so that a card somebody reformatted exFAT reports its real state instead of
# looking like a wiring fault -- a false negative on this test is the most
# expensive outcome it has.
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN=y
