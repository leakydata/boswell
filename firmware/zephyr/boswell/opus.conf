# Opus instead of IMA ADPCM. See Kconfig for what it costs.
#
# Kept out of prj.conf so the codec is a deliberate choice per build, and so
# a wearable that has not been reflashed still builds exactly as before.
CONFIG_BOSWELL_OPUS=y

# Opus wants more stack than the default for its encoder state, and the
# encode runs on the capture thread where a smash would look like a codec
# fault rather than a stack fault.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
