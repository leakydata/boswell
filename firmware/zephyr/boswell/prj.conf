# Boswell firmware — Zephyr / nRF Connect SDK
#
# The wire protocol is deliberately identical to the Arduino build: same
# service and characteristic UUIDs, same 12-byte frame header, same IMA ADPCM.
# The host does not need to know which firmware is running.

CONFIG_LOG=y
# Deferred, not immediate: in immediate mode every LOG_* call renders and
# writes synchronously in its caller's context, including the Bluetooth
# stack's threads, and the USB CDC backend can block there.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=y

# Logs over USB CDC. Without a console there is no way to see why the firmware
# did not do what was expected -- the first version of this shipped blind and
# simply failed to advertise with nothing to say why.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Boswell"
CONFIG_USB_DEVICE_VID=0x2886
CONFIG_USB_DEVICE_PID=0x8045
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# --- Bluetooth -------------------------------------------------------------
# These values are taken from Omi's shipping configuration for this exact
# board (prj_xiao_ble_sense_devkitv2-adafruit.conf). They run the same job on
# the same silicon, and guessing at buffer sizes had already cost a working
# connection once.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO-MIC"
CONFIG_BT_DEVICE_APPEARANCE=832
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CLIENT=n

# Throughput. A steady audio stream needs depth here or notifications stall.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Negotiate the faster PHY and longer packets automatically.
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# --- Control security ---------------------------------------------------------
# The control characteristic arms the microphone, erases the backlog and can
# reboot the device into its bootloader. Left open, anyone within radio range
# could do all three to a microphone somebody is wearing.
#
# Encryption is required for control writes. Pairing is Just Works, because
# this board has no display or keypad to confirm a passkey with -- so it stops
# a passer-by issuing commands and does not stop a determined attacker who is
# present at the moment of pairing. Saying that plainly is better than
# implying more.
#
# Bonds are stored, so the host pairs once. "boswell unpair" forgets them, and
# the USB shell can always arm and disarm regardless -- that is the way back
# in if pairing ever fails.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=2

# Vendor-specific HCI, for setting radio transmit power at runtime.
CONFIG_BT_HCI_VS=y

CONFIG_FPU=y

# --- Audio capture ---------------------------------------------------------
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
# Selects NRFX_PDM itself; setting that directly is rejected.
CONFIG_AUDIO_DMIC_NRFX_PDM=y

# The board powers the microphone and IMU through fixed regulators declared in
# its devicetree -- including the high-drive setting the IMU needs, which had
# to be discovered by hand in the Arduino build.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# --- Storage for settings and the flash buffer -----------------------------
CONFIG_RING_BUFFER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Watchdog --------------------------------------------------------------
# Two hangs in the Arduino build left the device dark with no way back.
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# --- Sensors ---------------------------------------------------------------
CONFIG_SENSOR=y
CONFIG_I2C=y

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y

# --- Store-and-forward -----------------------------------------------------
CONFIG_RING_BUFFER=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NORDIC_QSPI_NOR=y
# The QSPI peripheral's DMA can only read from word-aligned RAM. The driver's
# default is to silently copy unaligned data through a 4-byte stack buffer,
# issuing one transfer per 4 bytes -- a 256-byte page write becomes 64
# transactions, and throughput collapsed to 2.3 KB/s against a 4.7 KB/s
# demand. Disabling it turns that into an error instead of a slow path, and
# the write buffer is aligned explicitly.
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=0

# sys_reboot() lives behind this; without it the DFU trigger fails to link.
CONFIG_REBOOT=y

# A shell on the USB console. Without it every firmware update needs someone
# physically double-tapping RESET, which is a poor loop to develop in.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="boswell> "

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# --- Host compatibility ------------------------------------------------------
# This has to work with whatever the user already owns: a Bluetooth 4.0 dongle,
# a modern laptop card, or a phone. So the peripheral asks for the best link it
# can and lets the central decline, rather than being pinned to one host.
#
# Measured on a 4.0 CSR dongle (0a12:0001), which has neither 2M PHY (a 5.0
# feature) nor Data Length Extension (4.2): the PHY request is refused and the
# link stays on 1M, the data-length update never fires, and a 30 s capture
# still returns 30.02 s of audio with 0% loss. Degradation is graceful, so
# leaving these on costs the old dongle nothing and gains a phone real
# throughput. (An earlier revision disabled both on the assumption they were
# breaking the 4.0 link. They were not -- that was the microphone supply and a
# connection-parameter collision.)
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

# --- Power ------------------------------------------------------------------
# The board's own devicetree already puts the SoC regulator in DCDC mode,
# which is the single largest saving on this part and costs nothing.
#
# System power management is OFF, deliberately.
#
# It looked like the obvious win -- every thread is blocked most of the time,
# and the kernel is already tickless -- but letting the CPU into a low-power
# state stops the clock the PDM peripheral runs from. Enabling it produced
# 474 "No audio data to be read" errors in 45 seconds: the microphone stalls
# and the capture is silence. Making it safe means holding a power-state lock
# for as long as the microphone is running, which is most of the time on an
# always-on recorder, so there is little left to save.
CONFIG_PM=n

# Device power management, so drivers can be suspended individually. The QSPI
# part supports deep power-down and the devicetree declares the timings for
# it; without this the flash sits powered even when the backlog is empty,
# which on a device that streams live most of the time is nearly always.
#
# Turned off once while bisecting a capture collapse and shown not to be the
# cause: the fault was bt_gatt_notify() blocking on the capture thread. The
# suspend path is guarded by CONFIG_PM_DEVICE so either setting builds.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=n

# Not measured. There is no cell on the board and no meter on the rail, so
# these are known-good settings rather than an observed saving. What has been
# verified is that they do not break capture, Bluetooth, the flash backlog or
# the USB console.
